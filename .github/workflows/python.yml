name: python

# Tests the Python decoder (python/), builds its sdist and wheel, and publishes
# them to PyPI as data-tamer-parser when a release tag X.Y.Z is pushed. The
# package is versioned with the library: the tag must equal every version in
# the repository, and the CHANGELOG head must be that release
# (tools/check_versions.py --tag, below). Publishing uses PyPI trusted
# publishing: pypi.org must list this repository, this workflow (python.yml)
# and the environment "pypi" as a trusted publisher of data-tamer-parser (a
# "pending publisher" before the first release creates the project).

on:
  push:
    branches: [main, V2]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Test without optional packages
      working-directory: python
      run: python -m unittest -v
    - name: Install the package with the mcap extra
      run: |
        python -m pip install "./python[mcap]"
        cd "$RUNNER_TEMP" && python -c "import data_tamer_parser, mcap; print(data_tamer_parser.__file__)"
    - name: Test with mcap (iter_mcap tests run)
      working-directory: python
      run: python -m unittest -v

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build sdist and wheel
      run: |
        python -m pip install build
        python -m build python --outdir dist
    - name: Check that the tag is a release of this version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        [[ "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag"; exit 1; }
        python tools/check_versions.py --tag "${GITHUB_REF_NAME}"
        # The built files carry the version setuptools read from __version__.
        test -f "dist/data_tamer_parser-${GITHUB_REF_NAME}.tar.gz"
        test -f "dist/data_tamer_parser-${GITHUB_REF_NAME}-py3-none-any.whl"
    - uses: actions/upload-artifact@v4
      with:
        name: python-dist
        path: dist/

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: python-dist
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1
